# .github/workflows/ci.yml
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Astro)
        run: npm run check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm run test:run

      - name: Production build
        run: npm run build
        env:
          PUBLIC_API_URL: https://api.ejemplo.com/api/v1